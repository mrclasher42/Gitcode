[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitcode-cli"
version = "0.1.0"
description = "Command-line client for GitCode"
requires-python = ">=3.8"

[project.scripts]
gc = "gitcode_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["gitcode_cli"]
