<!DOCTYPE html>
<html lang="en" dir="ltr" data-color-mode="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitCode</title>
    <script>
      (function () {
        try {
          var lang = localStorage.getItem("gc-lang") || "en";
          document.documentElement.setAttribute("lang", lang);
          document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");

          var t = localStorage.getItem("gc-theme") || "system";
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-color-mode", t);
            document.documentElement.setAttribute("data-theme", t);
          } else {
            var sys = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.setAttribute("data-color-mode", sys);
            document.documentElement.setAttribute("data-theme", sys);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
